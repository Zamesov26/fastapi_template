services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    env_file:
      - path: ../.env
        required: false
    ports:
      - '8000:8000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health/live')
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
